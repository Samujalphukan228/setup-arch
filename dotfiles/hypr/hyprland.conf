# ══════════════════════════════════════════════════════
#   HYPRLAND CONFIG — PREMIUM EDITION by Samujal
# ══════════════════════════════════════════════════════

################
### MONITORS ###
################

monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = wpaperd
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/bin/nm-applet --indicator
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,7
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(ffffffff) rgba(999999ff) 45deg
    col.inactive_border = rgba(000000ff)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(00000077)
        offset = 0 8
    }

    blur {
        enabled = true
        size = 10
        passes = 4
        noise = 0.01
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.15
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = yes

    bezier = wind,    0.05, 0.9,  0.1,  1.05
    bezier = winIn,   0.1,  1.1,  0.1,  1.1
    bezier = winOut,  0.3,  -0.3, 0,    1
    bezier = liner,   1,    1,    1,    1
    bezier = smooth,  0.25, 1,    0.5,  1
    bezier = premium, 0.05, 0.95, 0.1,  1.0

    animation = windows,     1, 5,  wind,    slide
    animation = windowsIn,   1, 5,  winIn,   slide
    animation = windowsOut,  1, 4,  winOut,  slide
    animation = windowsMove, 1, 4,  premium, slide
    animation = border,      1, 8,  smooth
    animation = borderangle, 1, 30, liner,   loop
    animation = fade,        1, 8,  smooth
    animation = workspaces,  1, 5,  smooth,  slidevert
    animation = layers,      1, 4,  smooth,  slide
}

dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        scroll_factor = 0.8
    }
}

# Gestures (new syntax since 0.51)
gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, brave
bind = SUPER, P, exec, pamac-manager
bind = SUPER, SPACE, exec, wofi --show drun
bind = SUPER, R, exec, rofi -show window

# Window management
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, G, togglegroup,

# Exit
bind = $mainMod, M, exit,

# Move focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize windows
binde = $mainMod ALT, left,  resizeactive, -40 0
binde = $mainMod ALT, right, resizeactive,  40 0
binde = $mainMod ALT, up,    resizeactive,  0 -40
binde = $mainMod ALT, down,  resizeactive,  0  40

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, S, exec, bash -c 'FILE=$(zenity --entry --title="Notes" --text="Note name:" --width=300) && foot --app-id=scratchpad -e nano $HOME/notes/$FILE.txt'
# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# Screenshots
bind = , Print,      exec, grim ~/Pictures/screenshot-$(date +%F-%T).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%F-%T).png

# Lock screen
bind = $mainMod, L, exec, hyprlock

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = float on, match:class pavucontrol
windowrule = size 800 600, match:class pavucontrol
windowrule = center on, match:class pavucontrol
windowrule = float on, match:class thunar
windowrule = size 900 600, match:class thunar
windowrule = center on, match:class thunar
windowrule = float on, match:class rofi
windowrule = center on, match:class rofi

# Notes popup
windowrule = float on, match:class zenity
windowrule = size 500 400, match:class zenity
windowrule = center on, match:class zenity
windowrule = float on, match:class scratchpad
windowrule = size 600 400, match:class scratchpad
windowrule = center on, match:class scratchpad
