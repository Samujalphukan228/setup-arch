background {
    monitor =
    color = rgba(10, 10, 12, 1.0)
}

input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(20, 20, 22, 1.0)
    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8a8f">Enter password…</span>
    fail_text = <span foreground="##ff6b6b">Wrong password</span>
    rounding = 12
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
