# ══════════════════════════════════════════════════════
#   KITTY CONFIG — PREMIUM EDITION by Samujal
# ══════════════════════════════════════════════════════

# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# Transparency & blur
background_opacity 1.0
background_blur    2
dynamic_background_color yes

# Padding
window_padding_width 12 16

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.2
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Tab bar
tab_bar_edge             top
tab_bar_style            separator
tab_separator            " │ "
tab_bar_min_tabs         1
tab_bar_margin_width     8.0
tab_bar_margin_height    4.0 4.0
tab_title_template       " {index}  {title[:12]} "
active_tab_font_style    bold
inactive_tab_font_style  normal

# Window
hide_window_decorations  yes
remember_window_size     yes
initial_window_width     900
initial_window_height    550
window_border_width      0px
draw_minimal_borders     yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Performance
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# Colors — Black & White
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #ffffff

cursor                  #ffffff
cursor_text_color       #000000

url_color               #aaaaaa
url_style               curly

# Black
color0  #000000
color8  #444444

# Red
color1  #cc0000
color9  #ff3333

# Green
color2  #00cc00
color10 #33ff33

# Yellow
color3  #cccc00
color11 #ffff33

# Blue
color4  #4444ff
color12 #6666ff

# Magenta
color5  #cc00cc
color13 #ff33ff

# Cyan
color6  #00cccc
color14 #33ffff

# White
color7  #cccccc
color15 #ffffff

# Tab colors
active_tab_foreground   #ffffff
active_tab_background   #000000
inactive_tab_foreground #444444
inactive_tab_background #000000
tab_bar_background      #000000

# Keybinds
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard
